name: Publish

on:
  push:
    tags: ["v*", "rpptx-v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build-cli-assets:
    name: CLI ${{ matrix.platform.label }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { label: linux-x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { label: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz }
          - { label: linux-musl-x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, archive: tar.gz }
          - { label: macos-x86_64, runner: macos-15-intel, target: x86_64-apple-darwin, archive: tar.gz }
          - { label: macos-arm64, runner: macos-14, target: aarch64-apple-darwin, archive: tar.gz }
          - { label: windows-x86_64, runner: windows-2025, target: x86_64-pc-windows-msvc, archive: zip }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Select Rust release family
        id: selected
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            v*) package=rdocx-cli; binary=rdocx; version=${GITHUB_REF_NAME#v} ;;
            rpptx-v*) package=rpptx-cli; binary=rpptx; version=${GITHUB_REF_NAME#rpptx-v} ;;
            *) exit 1 ;;
          esac
          echo "package=${package}" >> "${GITHUB_OUTPUT}"
          echo "binary=${binary}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.platform.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install musl toolchain
        if: matrix.platform.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Build selected CLI
        shell: bash
        run: |
          build_args=()
          if [[ "${{ matrix.platform.target }}" == "x86_64-unknown-linux-musl" ]]; then
            build_args+=(--no-default-features)
          fi
          cargo build --release --locked \
            --package "${{ steps.selected.outputs.package }}" \
            --target "${{ matrix.platform.target }}" \
            "${build_args[@]}"
      - name: Smoke-test selected CLI
        shell: bash
        run: |
          binary_path="target/${{ matrix.platform.target }}/release/${{ steps.selected.outputs.binary }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            binary_path="${binary_path}.exe"
          fi
          version_output=$("$binary_path" --version)
          [[ "$version_output" == "${{ steps.selected.outputs.binary }} ${{ steps.selected.outputs.version }}" ]]
          "$binary_path" --help
          "$binary_path" inspect --help
      - name: Package selected CLI
        shell: bash
        run: |
          binary="${{ steps.selected.outputs.binary }}"
          source="target/${{ matrix.platform.target }}/release/${binary}"
          stage="${RUNNER_TEMP}/cli-package"
          mkdir -p "$stage" dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            source="${source}.exe"
            cp "$source" "$stage/${binary}.exe"
          else
            cp "$source" "$stage/$binary"
            chmod +x "$stage/$binary"
          fi
          cp "crates/${{ steps.selected.outputs.package }}/README.md" "$stage/README.md"
          cp LICENSE "$stage/LICENSE"
          archive_name="${binary}-${{ matrix.platform.target }}.${{ matrix.platform.archive }}"
          archive_path="${GITHUB_WORKSPACE}/dist/${archive_name}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cd "$stage"
            7z a -tzip "$archive_path" "${binary}.exe" README.md LICENSE
          else
            tar -C "$stage" -czf "$archive_path" "$binary" README.md LICENSE
          fi
      - name: Upload selected CLI archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-asset-${{ matrix.platform.label }}
          path: dist/${{ steps.selected.outputs.binary }}-${{ matrix.platform.target }}.${{ matrix.platform.archive }}
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    needs: cli-assets
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Verify output stability
        run: python3 scripts/hash_harness.py --check

      - name: Verify release metadata
        run: python3 -m unittest scripts.test_sprint_workflow.SprintWorkflowTests.test_stable_release_family_is_prepared_at_0_14_0 scripts.test_sprint_workflow.SprintWorkflowTests.test_immutable_rdocx_layout_0_10_1_registry_graph_remains_at_oxml_layout_0_6_0 scripts.test_sprint_workflow.SprintWorkflowTests.test_incubating_release_family_is_prepared_at_0_12_1

      - name: Verify published shared family for stable release
        if: startsWith(github.ref_name, 'v')
        run: python3 -m unittest scripts.test_sprint_workflow.SprintWorkflowTests.test_prepared_rdocx_0_14_0_requires_published_shared_0_12_1
        env:
          RDOCX_VERIFY_PUBLISHED_SHARED: "1"

      - name: Verify reviewed release notes
        run: python3 scripts/sprint_workflow.py release-notes "${{ github.ref_name }}" --check

      - name: Verify publication archives
        run: |
          cargo publish --workspace --dry-run \
            --config 'patch.crates-io.oxml-core.path="crates/oxml-core"' \
            --config 'patch.crates-io.oxml-drawing.path="crates/oxml-drawing"' \
            --config 'patch.crates-io.oxml-layout.path="crates/oxml-layout"' \
            --config 'patch.crates-io.oxml-media.path="crates/oxml-media"' \
            --config 'patch.crates-io.oxml-opc.path="crates/oxml-opc"' \
            --config 'patch.crates-io.oxml-pdf.path="crates/oxml-pdf"' \
            --config 'patch.crates-io.oxml-sml.path="crates/oxml-sml"' \
            --config 'patch.crates-io.oxml-cli-support.path="crates/oxml-cli-support"' \
            --config 'patch.crates-io.oxml-chart.path="crates/oxml-chart"' \
            --config 'patch.crates-io.rdocx.path="crates/rdocx"' \
            --config 'patch.crates-io.rdocx-cli.path="crates/rdocx-cli"' \
            --config 'patch.crates-io.rdocx-html.path="crates/rdocx-html"' \
            --config 'patch.crates-io.rdocx-layout.path="crates/rdocx-layout"' \
            --config 'patch.crates-io.rdocx-opc.path="crates/rdocx-opc"' \
            --config 'patch.crates-io.rdocx-oxml.path="crates/rdocx-oxml"' \
            --config 'patch.crates-io.rdocx-pdf.path="crates/rdocx-pdf"' \
            --config 'patch.crates-io.rpptx.path="crates/rpptx"' \
            --config 'patch.crates-io.rpptx-cli.path="crates/rpptx-cli"' \
            --config 'patch.crates-io.rpptx-chart.path="crates/rpptx-chart"' \
            --config 'patch.crates-io.rpptx-layout.path="crates/rpptx-layout"' \
            --config 'patch.crates-io.rpptx-oxml.path="crates/rpptx-oxml"' \
            --config 'patch.crates-io.rpptx-render.path="crates/rpptx-render"'

      - name: Publish stable allowlist
        if: startsWith(github.ref_name, 'v')
        run: |
          cargo publish -p rdocx-opc
          sleep 60
          cargo publish -p rdocx-oxml
          sleep 60
          cargo publish -p rdocx-layout
          sleep 60
          cargo publish -p rdocx-html
          sleep 60
          cargo publish -p rdocx-pdf
          sleep 60
          cargo publish -p rdocx
          sleep 60
          cargo publish -p rdocx-cli

      - name: Publish incubating allowlist
        if: startsWith(github.ref_name, 'rpptx-v')
        run: |
          cargo publish -p oxml-core
          sleep 60
          cargo publish -p oxml-opc
          sleep 60
          cargo publish -p oxml-media
          sleep 60
          cargo publish -p oxml-layout
          sleep 60
          cargo publish -p oxml-drawing
          sleep 60
          cargo publish -p oxml-pdf
          sleep 60
          cargo publish -p oxml-sml
          sleep 60
          cargo publish -p oxml-cli-support
          sleep 60
          cargo publish -p oxml-chart
          sleep 60
          cargo publish -p rpptx-oxml
          sleep 60
          cargo publish -p rpptx-chart
          sleep 60
          cargo publish -p rpptx-layout
          sleep 60
          cargo publish -p rpptx-render
          sleep 60
          cargo publish -p rpptx
          sleep 60
          cargo publish -p rpptx-cli

  cli-assets:
    name: Verify CLI release assets
    needs: build-cli-assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download CLI archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: cli-asset-*
          merge-multiple: true
      - name: Validate archives and write checksums
        shell: bash
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          import os
          from pathlib import Path
          import tarfile
          import zipfile

          tag = os.environ["GITHUB_REF_NAME"]
          if tag.startswith("rpptx-v"):
              binary = "rpptx"
          elif tag.startswith("v"):
              binary = "rdocx"
          else:
              raise AssertionError(f"unsupported Rust release tag {tag}")

          expected_targets = {
              "x86_64-unknown-linux-gnu": ".tar.gz",
              "aarch64-unknown-linux-gnu": ".tar.gz",
              "x86_64-unknown-linux-musl": ".tar.gz",
              "x86_64-apple-darwin": ".tar.gz",
              "aarch64-apple-darwin": ".tar.gz",
              "x86_64-pc-windows-msvc": ".zip",
          }
          dist = Path("dist")
          expected_names = {
              f"{binary}-{target}{suffix}"
              for target, suffix in expected_targets.items()
          }
          archives = sorted(path for path in dist.iterdir() if path.is_file())
          assert {path.name for path in archives} == expected_names, archives

          expected_readme = Path(f"crates/{binary}-cli/README.md").read_bytes()
          expected_license = Path("LICENSE").read_bytes()

          def normalize_text(payload: bytes) -> bytes:
              return payload.replace(b"\r\n", b"\n")

          checksum_lines = []
          for archive in archives:
              executable = f"{binary}.exe" if archive.suffix == ".zip" else binary
              expected_members = {executable, "README.md", "LICENSE"}
              if archive.suffix == ".zip":
                  with zipfile.ZipFile(archive) as package:
                      members = {info.filename: info for info in package.infolist()}
                      assert set(members) == expected_members, members
                      payloads = {name: package.read(name) for name in members}
              else:
                  with tarfile.open(archive, "r:gz") as package:
                      members = {member.name: member for member in package.getmembers()}
                      assert set(members) == expected_members, members
                      assert all(member.isfile() for member in members.values())
                      assert members[executable].mode & 0o111
                      payloads = {
                          name: package.extractfile(member).read()
                          for name, member in members.items()
                      }
              assert payloads[executable]
              assert normalize_text(payloads["README.md"]) == normalize_text(expected_readme)
              assert normalize_text(payloads["LICENSE"]) == normalize_text(expected_license)
              digest = sha256(archive.read_bytes()).hexdigest()
              checksum_lines.append(f"{digest}  {archive.name}")

          (dist / "SHA256SUMS").write_text("\n".join(checksum_lines) + "\n", encoding="utf-8")
          PY
          cd dist
          sha256sum --check SHA256SUMS
      - name: Upload reviewed CLI assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-release-assets-${{ github.ref_name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [publish, cli-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download reviewed CLI assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-release-assets-${{ github.ref_name }}
          path: ${{ runner.temp }}/cli-assets
      - name: Create GitHub Release from reviewed notes
        run: |
          python3 scripts/sprint_workflow.py release-notes "${{ github.ref_name }}" --check
          python3 scripts/sprint_workflow.py release-notes "${{ github.ref_name }}" --render > "$RUNNER_TEMP/release-notes.md"
          python3 scripts/sprint_workflow.py release-notes "${{ github.ref_name }}" --render | cmp - "$RUNNER_TEMP/release-notes.md"
          gh release create "${{ github.ref_name }}" "${RUNNER_TEMP}/cli-assets/"* --notes-file "$RUNNER_TEMP/release-notes.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
